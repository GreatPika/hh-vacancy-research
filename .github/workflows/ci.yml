name: CI

on:
  push:
    branches:
      - main
      - docs/hh-vacancy-research-wizard
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check installer syntax
        run: node --check bin/hh-vacancy-research-skill.mjs

      - name: Test installer
        run: node --test tests/test_installer.mjs

      - name: Install Python test dependencies
        run: python -m pip install pytest openpyxl

      - name: Test Python scripts
        run: python -m pytest

      - name: Check npm package contents
        run: npm pack --dry-run
